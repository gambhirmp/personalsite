{% extends "base.html" %}

{% block head_extra %}
<style>
.two-column-section {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
    gap: 2rem;
    align-items: stretch;
    margin-bottom: 2rem;
}
.two-column-content {
    flex: 1 1 0;
    min-width: 0;
}
.two-column-content > *:last-child {
    margin-bottom: 0;
}
.two-column-image {
    min-width: 0;
    min-height: 0;
    margin-top: 0rem;
    display: flex;
    justify-content: center;
    overflow: hidden;
}
.two-column-image img {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    border-radius: 0.5rem;
    object-fit: cover;
    object-position: top;
}
@media (max-width: 768px) {
    .two-column-section {
        display: flex;
        flex-direction: column;
    }
    .two-column-image {
        flex: 1 1 auto;
        max-width: 100%;
        margin-top: 1rem;
    }
    .two-column-image img {
        width: 100%;
        height: auto;
        max-width: 100%;
    }
}
</style>
{% endblock head_extra %}

{% block content %}
<article>{{ section.content | safe }}</article>

{% endblock content %}
